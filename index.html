<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Futsal & Pagelle</title>
    
    <!-- Meta tag per bloccare la cache della pagina HTML -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- CSS principale con versione (aggiorna il numerino ?v=1.x ad ogni modifica) -->
    <link rel="stylesheet" href="style.css?v=1.0">
</head>
<body>

    <!-- QUI VA IL CONTENUTO DELLA TUA APP -->
    <div id="app">
        <!-- Interfaccia dell'app -->
    </div>

    <!-- Firebase SDK (Versioni stabili) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <!-- Script principale dell'app con versione anti-cache -->
    <script src="app.js?v=1.0"></script>
</body>
</html>
